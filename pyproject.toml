[project]
name = "blsy-dagster-server"
version = "1.13.25.1"
description = "BLSY Dagster Server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # server
    "dagster==1.13.25",
    "dagster-webserver",
    "dagster-postgres",
    "dagster-duckdb",
    "dagster-pandas",
    "dagster-aws",
    "psycopg[binary]",
]
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'"
]
